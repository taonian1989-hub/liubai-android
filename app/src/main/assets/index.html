<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F7F2"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"><title>留白 · 把自己放回生活里</title><link rel="stylesheet" href="app.css"></head>
<body><div id="app"><header class="topbar"><button class="brand" data-nav="home" aria-label="留白首页"><span class="brandmark">◱</span><b>留白</b><span class="brand-en">LIUBAI</span></button><button class="iconbtn" data-action="settings" aria-label="打开设置"><span class="avatar">我</span></button></header>
<main id="main"></main>
<section id="composer" class="composer"><form id="chat-form"><textarea id="question" maxlength="10000" rows="1" aria-label="和留白说说" placeholder="想到什么，就说说…"></textarea><button type="submit" id="send" aria-label="发送消息">↑</button></form><div class="composer-foot"><button id="online" aria-pressed="false"><span>◎</span> 联网搜索 <span id="online-state">关</span></button><span id="connection">本机私享 · 免登录</span></div></section>
<nav class="bottomnav" aria-label="主导航"><button data-nav="home" class="active"><span>◱</span>今天</button><button data-nav="chat"><span>◌</span>聊聊</button><button data-nav="library"><span>▤</span>收纳</button><button data-nav="settings"><span>⚙</span>我的</button></nav></div>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title"></h2><button class="iconbtn" data-action="close" aria-label="关闭">×</button></div><div id="sheet-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
